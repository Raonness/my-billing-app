<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huahin Admin Control - ผู้ดูแลระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sea-deep: #0a2540; --sea-blue: #0077b6; --sea-cyan: #00b4d8; --sea-foam: #90e0ef;
      --glass-sea: rgba(10, 37, 64, 0.75); --glass-border: rgba(144, 224, 239, 0.25);
    }
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s ease; }
    body {
      background: linear-gradient(180deg, rgba(10,37,64,0.92) 0%, rgba(0,119,182,0.75) 100%),
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      color: white; min-height: 100vh; padding: 25px 10px; margin: 0; display: flex; justify-content: center;
    }
    
    /* Loader Overlay */
    .loader-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 37, 64, 0.85); backdrop-filter: blur(6px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .loader-overlay.active { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 50px; height: 50px; border: 4px solid var(--glass-border);
      border-top-color: #22c55e; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: white; font-size: 16px; font-weight: 500; letter-spacing: 1px; }

    .container { width: 100%; max-width: 850px; }
    .card {
      background: var(--glass-sea); backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 20px; margin: 0; color: var(--sea-foam); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--sea-foam); }
    input, select {
      width: 100%; padding: 12px; background: rgba(10, 37, 64, 0.85);
      border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;
    }
    .btn { padding: 8px 14px; border: none; border-radius: 10px; font-weight: 500; cursor: pointer; font-size: 13px; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--sea-cyan), var(--sea-blue)); color: white; padding: 12px; }
    .btn-agree { background: #22c55e; color: #0a2540; font-weight: 600; margin-right: 5px; }
    .btn-reject { background: #f43f5e; color: white; font-weight: 600; }
    .btn-bulk { width: 100%; background: linear-gradient(135deg, #f97316, #ea580c); color: white; padding: 12px; margin-bottom: 20px; font-size: 14px; }
    .btn-nav { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--glass-border); font-size: 13px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th { text-align: left; padding: 10px; color: var(--sea-foam); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999999; }
    .toast { padding: 12px 20px; border-radius: 10px; background: rgba(10,37,64,0.95); border: 1px solid var(--glass-border); color: white; margin-bottom: 10px;}
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div class="loader-overlay" id="globalLoader">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">กำลังโหลดข้อมูล...</div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <!-- หน้า Login -->
    <div class="card" id="loginCard" style="max-width: 380px; margin: 80px auto;">
      <h2 style="margin-top:0; text-align:center; color: var(--sea-foam);">🔒 Admin Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>รหัสผ่านผู้ดูแลระบบ:</label>
          <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่าน..." required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-submit">เข้าสู่ระบบ</button>
      </form>
    </div>

    <!-- แผงผู้ดูแล -->
    <div id="adminPanel" style="display:none;">
      <div class="top-bar">
        <h1>🛡️ ระบบผู้ดูแล (Admin Control)</h1>
        <div>
          <a href="index.html" class="btn-nav">🏖️ กลับหน้าลูกค้า</a>
          <button class="btn" style="background:#f43f5e; color:white;" onclick="logout()">ออกจากระบบ</button>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0; font-size: 17px; color: var(--sea-cyan);">⏳ รายการแจ้งชำระเงินรอยืนยัน (ล่าสุดอยู่บน)</h2>
        <table>
          <thead><tr><th>ชื่อลูกค้า</th><th>เวลาทำรายการ</th><th>จำนวนเงิน</th><th>ดำเนินการ</th></tr></thead>
          <tbody id="pendingTableBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h2 style="margin-top:0; font-size: 17px; color: #a855f7;">✏️ จัดการยอดลูกค้า</h2>
        <button class="btn btn-bulk" onclick="bulkAdd10()">⚡ ➕ เพิ่มตั้งหนี้ +10 บาทให้ทุกคน</button>
        <form id="adminActionForm">
          <div class="form-group">
            <label>รูปแบบทำรายการ:</label>
            <select id="actionType">
              <option value="deduct">🔴 เพิ่มยอดตั้งหนี้ (เพิ่มหนี้ +)</option>
              <option value="update">🟢 รับชำระเงินโดยตรง (ลดยอด -)</option>
              <option value="add">🔵 เพิ่มลูกค้าใหม่</option>
            </select>
          </div>
          <div class="form-group">
            <label>ชื่อลูกค้า:</label>
            <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้า" required>
          </div>
          <div class="form-group">
            <label>จำนวนเงิน (บาท):</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
          </div>
          <button type="submit" class="btn btn-submit">บันทึกรายการ</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";
    const ADMIN_PASS = "Project I";

    function showLoader(text = "กำลังโหลด...") {
      document.getElementById("loaderText").innerText = text;
      document.getElementById("globalLoader").classList.add("active");
    }
    function hideLoader() { document.getElementById("globalLoader").classList.remove("active"); }

    function notify(msg, ok = true) {
      const c = document.getElementById("toastContainer");
      const t = document.createElement("div"); t.className = "toast";
      t.style.borderLeft = ok ? "4px solid #22c55e" : "4px solid #f43f5e";
      t.innerText = msg; c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("adminLoggedIn") === "true") showAdminPanel();
      document.getElementById("loginForm")?.addEventListener("submit", (e) => {
        e.preventDefault();
        if (document.getElementById("adminPassword").value.trim() === ADMIN_PASS) {
          sessionStorage.setItem("adminLoggedIn", "true"); showAdminPanel(); notify("เข้าสู่ระบบสำเร็จ!");
        } else notify("รหัสผ่านไม่ถูกต้อง!", false);
      });
    });

    function showAdminPanel() {
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      loadPendingPayments();
    }
    function logout() { sessionStorage.removeItem("adminLoggedIn"); location.reload(); }

    function loadPendingPayments() {
      showLoader("กำลังโหลดรายการรอยืนยัน...");
      fetch(WEB_APP_URL)
        .then(r => r.json())
        .then(data => {
          const tbody = document.getElementById("pendingTableBody"); tbody.innerHTML = "";
          let count = 0;
          data.forEach(item => {
            if (item.Status === "Pending Verification") {
              count++;
              const timeStr = item.Timestamp ? new Date(item.Timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '-';
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td style="font-weight:500;">${item.Customer_Name || '-'}</td>
                <td style="font-size:11px; color:#cbd5e1;">${timeStr}</td>
                <td style="color:#86efac; font-weight:600;">-${Math.abs(parseFloat(item.Amount)||0).toLocaleString()} ฿</td>
                <td>
                  <button class="btn btn-agree" onclick="processPayment(${item.rowIndex}, 'approve')">ตกลง</button>
                  <button class="btn btn-reject" onclick="processPayment(${item.rowIndex}, 'reject')">ปฏิเสธ</button>
                </td>`;
              tbody.appendChild(tr);
            }
          });
          if (count === 0) tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--sea-foam);">ไม่มีรายการรอยืนยัน</td></tr>`;
        })
        .catch(() => notify("โหลดข้อมูลผิดพลาด", false))
        .finally(() => hideLoader());
    }

    function processPayment(rowIndex, statusType) {
      const isAgree = statusType === 'approve';
      if (!confirm(`ยืนยันที่จะ "${isAgree ? 'ตกลง' : 'ปฏิเสธ'}" รายการนี้?`)) return;
      showLoader("กำลังประมวลผล...");

      fetch(WEB_APP_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: statusType, rowIndex: rowIndex })
      })
      .then(() => { notify(isAgree ? "อนุมัติรายการสำเร็จ!" : "ปฏิเสธรายการเรียบร้อย!"); loadPendingPayments(); })
      .catch(() => { notify("เกิดข้อผิดพลาด กรุณาลองใหม่", false); hideLoader(); });
    }

    function bulkAdd10() {
      if (!confirm("ยืนยันการตั้งหนี้ +10 บาทให้ทุกคน?")) return;
      showLoader("กำลังรันสคริปต์ตั้งหนี้ +10 บาท...");

      fetch(WEB_APP_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: "bulkAdd10" })
      })
      .then(() => notify("เพิ่มตั้งหนี้ +10 บาทให้ทุกคนสำเร็จ!"))
      .catch(() => notify("ทำรายการไม่สำเร็จ", false))
      .finally(() => hideLoader());
    }

    document.getElementById("adminActionForm")?.addEventListener("submit", function(e) {
      e.preventDefault();
      showLoader("กำลังบันทึกข้อมูล...");

      fetch(WEB_APP_URL, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          actionType: document.getElementById("actionType").value,
          customerName: document.getElementById("customerName").value.trim(),
          amount: parseFloat(document.getElementById("amount").value) || 0
        })
      })
      .then(() => { notify("บันทึกรายการสำเร็จ!"); document.getElementById("adminActionForm").reset(); })
      .catch(() => notify("บันทึกข้อมูลไม่สำเร็จ", false))
      .finally(() => hideLoader());
    });
  </script>
</body>
</html>
