<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - อนุมัติการชำระเงิน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s ease; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }

    .container { width: 100%; max-width: 800px; }
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; background: linear-gradient(to right, #22c55e, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-approve { background: var(--accent-green); color: #0f172a; font-weight: 600; }
    .btn-approve:hover { background: #16a34a; color: white; }
    .btn-nav { background: rgba(255, 255, 255, 0.1); color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; border: 1px solid var(--glass-border); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th { text-align: left; padding: 10px 8px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; padding: 14px 20px; border-radius: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--glass-border); color: white; font-size: 14px; border-left: 4px solid var(--accent-green); }
  </style>
</head>
<body onload="loadPendingPayments()">

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="top-bar">
      <h1>🛡️ ระบบจัดการและอนุมัติยอด (Admin)</h1>
      <a href="index.html" class="btn-nav">🙋‍♂️ ไปหน้าลูกค้า</a>
    </div>

    <!-- ส่วนที่แสดงรายการที่ลูกเจ้ารออนุมัติ -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--accent-cyan);">⏳ รายการแจ้งชำระเงินที่รอยืนยัน</h2>
      <table>
        <thead>
          <tr>
            <th>ชื่อลูกค้า</th>
            <th>จำนวนเงิน</th>
            <th>สถานะ</th>
            <th>จัดการ</th>
          </tr>
        </thead>
        <tbody id="pendingTableBody">
          <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";

    function notify(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<span>✅</span> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function loadPendingPayments() {
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("pendingTableBody");
          tbody.innerHTML = "";
          let count = 0;

          data.forEach(item => {
            if (item.Status === "Pending Verification") {
              count++;
              const tr = document.createElement("tr");
              const amt = Math.abs(parseFloat(item.Amount) || 0).toLocaleString();

              tr.innerHTML = `
                <td style="font-weight:500;">${item.Customer_Name || '-'}</td>
                <td style="color:var(--accent-green); font-weight:600;">-${amt} ฿</td>
                <td><span style="color:#f59e0b; background:rgba(245, 158, 11, 0.15); padding:3px 8px; border-radius:6px; font-size:12px;">รอยืนยัน</span></td>
                <td><button class="btn btn-approve" onclick="approvePayment(${item.rowIndex})">✅ อนุมัติว่าจ่ายแล้ว</button></td>
              `;
              tbody.appendChild(tr);
            }
          });

          if (count === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">ไม่มีรายการที่รอยืนยันในขณะนี้</td></tr>`;
          }
        })
        .catch(err => {
          document.getElementById("pendingTableBody").innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--accent-red);">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
        });
    }

    function approvePayment(rowIndex) {
      if (!confirm("ยืนยันว่าลูกค้ารายนี้ชำระเงินเรียบร้อยแล้วใช่หรือไม่?")) return;

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: "approve", rowIndex: rowIndex })
      })
      .then(res => res.json())
      .then(() => {
        notify("อนุมัติยอดเงินเรียบร้อยแล้ว!");
        loadPendingPayments(); // รีเฟรชตาราง
      })
      .catch(err => alert("เกิดข้อผิดพลาด: " + err));
    }
  </script>
</body>
</html>
