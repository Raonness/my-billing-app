<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huahin Admin Control - ผู้ดูแลระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sea-deep: #0a2540;
      --sea-blue: #0077b6;
      --sea-cyan: #00b4d8;
      --sea-foam: #90e0ef;
      --glass-sea: rgba(10, 37, 64, 0.7);
      --glass-border: rgba(144, 224, 239, 0.25);
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s ease; }
    body {
      background: linear-gradient(180deg, rgba(10,37,64,0.92) 0%, rgba(0,119,182,0.75) 100%),
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
      color: white; min-height: 100vh; padding: 25px 10px; margin: 0; display: flex; justify-content: center;
    }

    .container { width: 100%; max-width: 850px; }
    .card {
      background: var(--glass-sea); backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 20px; margin: 0; color: var(--sea-foam); }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--sea-foam); }
    input, select {
      width: 100%; padding: 12px; background: rgba(10, 37, 64, 0.85);
      border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;
    }

    .btn { padding: 8px 14px; border: none; border-radius: 10px; font-weight: 500; cursor: pointer; font-size: 13px; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, var(--sea-cyan), var(--sea-blue)); color: white; padding: 12px; }
    .btn-agree { background: #22c55e; color: #0a2540; font-weight: 600; margin-right: 5px; }
    .btn-reject { background: #f43f5e; color: white; font-weight: 600; }
    .btn-bulk { width: 100%; background: linear-gradient(135deg, #f97316, #ea580c); color: white; padding: 10px; margin-bottom: 20px; }
    .btn-nav { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--glass-border); font-size: 13px; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th { text-align: left; padding: 10px; color: var(--sea-foam); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    .toast { padding: 12px 20px; border-radius: 10px; background: rgba(10,37,64,0.95); border: 1px solid var(--glass-border); color: white; }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    
    <!-- 🔒 1. หน้า Login เข้าสู่ระบบ -->
    <div class="card" id="loginCard" style="max-width: 380px; margin: 80px auto;">
      <h2 style="margin-top:0; text-align:center; color: var(--sea-foam);">🔒 Admin Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>รหัสผ่านผู้ดูแลระบบ:</label>
          <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่าน..." required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-submit">เข้าสู่ระบบ</button>
      </form>
    </div>

    <!-- 🛡️ 2. แผงควบคุมผู้ดูแลระบบ -->
    <div id="adminPanel" style="display:none;">
      <div class="top-bar">
        <h1>🛡️ ระบบผู้ดูแล (Admin Control)</h1>
        <div>
          <a href="index.html" class="btn-nav">🏖️ กลับหน้าลูกค้า</a>
          <button class="btn" style="background:#f43f5e; color:white;" onclick="logout()">ออกจากระบบ</button>
        </div>
      </div>

      <!-- รายการรอยืนยัน -->
      <div class="card">
        <h2 style="margin-top:0; font-size: 17px; color: var(--sea-cyan);">⏳ รายการแจ้งชำระเงินที่รอการอนุมัติ</h2>
        <table>
          <thead>
            <tr>
              <th>ชื่อลูกค้า</th>
              <th>เวลาทำรายการ</th>
              <th>จำนวนเงิน</th>
              <th>การดำเนินการ</th>
            </tr>
          </thead>
          <tbody id="pendingTableBody">
            <tr><td colspan="4" style="text-align:center; color:var(--sea-foam);">กำลังโหลดข้อมูล...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- จัดการและแก้ไขยอด -->
      <div class="card">
        <h2 style="margin-top:0; font-size: 17px; color: #a855f7;">✏️ จัดการยอดลูกค้า (เพิ่ม/ลด/ตั้งหนี้)</h2>
        
        <button class="btn btn-bulk" id="bulkBtn" onclick="bulkAdd10()">⚡ ➕ เพิ่มตั้งหนี้ +10 บาทให้ทุกคน</button>

        <form id="adminActionForm">
          <div class="form-group">
            <label>รูปแบบการทำรายการ:</label>
            <select id="actionType">
              <option value="deduct">🔴 เพิ่มยอดตั้งหนี้ (เพิ่มหนี้ +)</option>
              <option value="update">🟢 รับชำระเงินโดยตรง (ลดยอด -)</option>
              <option value="add">🔵 เพิ่มลูกค้าใหม่พร้อมยอดตั้งต้น</option>
            </select>
          </div>
          <div class="form-group">
            <label>ชื่อลูกค้า:</label>
            <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้า" required>
          </div>
          <div class="form-group">
            <label>จำนวนเงิน (บาท):</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
          </div>
          <button type="submit" class="btn btn-submit" id="saveBtn">บันทึกรายการ</button>
        </form>
      </div>

    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";
    const ADMIN_PASS = "Project I"; // 🔑 รหัสผ่านเข้าสู่ระบบ

    function notify(msg, ok = true) {
      const c = document.getElementById("toastContainer");
      const t = document.createElement("div");
      t.className = "toast";
      t.style.borderLeft = ok ? "4px solid #22c55e" : "4px solid #f43f5e";
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (sessionStorage.getItem("adminLoggedIn") === "true") showAdminPanel();

      document.getElementById("loginForm")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const pass = document.getElementById("adminPassword").value.trim();
        if (pass === ADMIN_PASS) {
          sessionStorage.setItem("adminLoggedIn", "true");
          showAdminPanel();
          notify("เข้าสู่ระบบสำเร็จ!");
        } else {
          notify("รหัสผ่านไม่ถูกต้อง!", false);
        }
      });
    });

    function showAdminPanel() {
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      loadPendingPayments();
    }

    function logout() { 
      sessionStorage.removeItem("adminLoggedIn"); 
      location.reload(); 
    }

    function loadPendingPayments() {
      fetch(WEB_APP_URL)
        .then(r => r.json())
        .then(data => {
          const tbody = document.getElementById("pendingTableBody");
          tbody.innerHTML = "";
          let count = 0;

          data.forEach(item => {
            if (item.Status === "Pending Verification") {
              count++;
              const tr = document.createElement("tr");
              const timeStr = item.Timestamp ? new Date(item.Timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '-';

              tr.innerHTML = `
                <td style="font-weight:500;">${item.Customer_Name || '-'}</td>
                <td style="font-size:11px; color:#cbd5e1;">${timeStr}</td>
                <td style="color:#86efac; font-weight:600;">-${Math.abs(parseFloat(item.Amount)||0).toLocaleString()} ฿</td>
                <td>
                  <button class="btn btn-agree" onclick="processPayment(${item.rowIndex}, 'approve')">ตกลง</button>
                  <button class="btn btn-reject" onclick="processPayment(${item.rowIndex}, 'reject')">ปฏิเสธ</button>
                </td>
              `;
              tbody.appendChild(tr);
            }
          });

          if (count === 0) tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--sea-foam);">ไม่มีรายการรอยืนยัน</td></tr>`;
        });
    }

    function processPayment(rowIndex, statusType) {
      const isAgree = statusType === 'approve';
      if (!confirm(`คุณแน่ใจหรือไม่ที่จะ "${isAgree ? 'ตกลง' : 'ปฏิเสธ'}" รายการนี้?`)) return;

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: statusType, rowIndex: rowIndex })
      })
      .then(() => {
        notify(isAgree ? "อนุมัติรายการสำเร็จ!" : "ปฏิเสธรายการเรียบร้อย!");
        loadPendingPayments();
      });
    }

    function bulkAdd10() {
      if (!confirm("ยืนยันการตั้งหนี้ +10 บาทให้ทุกคน?")) return;
      const btn = document.getElementById("bulkBtn");
      btn.innerText = "กำลังดำเนินการ..."; btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: "bulkAdd10" })
      })
      .then(() => { notify("เพิ่มตั้งหนี้ +10 บาทให้ทุกคนสำเร็จ!"); })
      .finally(() => { btn.innerText = "⚡ ➕ เพิ่มตั้งหนี้ +10 บาทให้ทุกคน"; btn.disabled = false; });
    }

    document.getElementById("adminActionForm")?.addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("saveBtn");
      btn.innerText = "กำลังบันทึก..."; btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          actionType: document.getElementById("actionType").value,
          customerName: document.getElementById("customerName").value.trim(),
          amount: parseFloat(document.getElementById("amount").value) || 0
        })
      })
      .then(() => {
        notify("บันทึกรายการสำเร็จ!");
        document.getElementById("adminActionForm").reset();
      })
      .finally(() => { btn.innerText = "บันทึกรายการ"; btn.disabled = false; });
    });
  </script>
</body>
</html>
