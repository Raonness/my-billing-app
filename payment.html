<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบผู้ดูแล - อนุมัติการชำระเงิน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sea-deep: #0a2540; --sea-blue: #0077b6; --sea-cyan: #00b4d8;
      --sea-foam: #90e0ef; --sand-gold: #f4a261; --glass-sea: rgba(10, 37, 64, 0.75);
      --glass-border: rgba(144, 224, 239, 0.25); --text-light: #f8fafc;
    }
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.2s ease; }
    body { background: var(--sea-deep); color: var(--text-light); min-height: 100vh; margin: 0; padding: 25px 15px; }
    .container { max-width: 950px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header h1 { font-size: 24px; margin: 0; color: var(--sea-foam); }
    .btn-back { background: rgba(255,255,255,0.1); color: var(--sea-foam); text-decoration: none; padding: 8px 16px; border-radius: 12px; font-size: 14px; border: 1px solid var(--glass-border); }
    
    .card {
      background: var(--glass-sea); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); margin-bottom: 25px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px 10px; color: var(--sea-foam); border-bottom: 1px solid var(--glass-border); }
    td { padding: 14px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); vertical-align: middle; }
    
    .btn-approve { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; margin-right: 4px; }
    .btn-reject { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600; }
    
    /* ปุ่มดูสลิป */
    .btn-slip { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
    .btn-slip:hover { background: #1d4ed8; transform: translateY(-1px); }
    .no-slip { color: #64748b; font-size: 12px; font-style: italic; }

    .badge-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(245, 158, 11, 0.4); }
    .badge-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(34, 197, 94, 0.4); }
    .badge-rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(239, 68, 68, 0.4); }

    /* Loader */
    .loader-overlay { position: fixed; inset: 0; background: rgba(10,37,64,0.85); backdrop-filter: blur(5px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; }
    .loader-overlay.active { opacity: 1; pointer-events: auto; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--glass-border); border-top-color: var(--sea-cyan); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast Notification */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; }
    .toast { padding: 12px 18px; border-radius: 10px; background: rgba(10, 37, 64, 0.95); border: 1px solid var(--glass-border); color: white; font-size: 13px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="margin-top:10px; color:var(--sea-foam); font-size:14px;" id="loaderText">กำลังโหลด...</div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="header">
      <h1>🔒 ระบบผู้ดูแล: อนุมัติสลิปและรายการชำระเงิน</h1>
      <a href="index.html" class="btn-back">⬅️ กลับหน้าหลัก</a>
    </div>

    <!-- ตารางรายการที่รอตรวจสอบ -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
        <h2 style="margin:0; font-size: 18px; color: var(--sea-cyan);">⏳ รายการรอการอนุมัติ (Pending Verification)</h2>
        <button onclick="loadData()" style="background:rgba(255,255,255,0.1); border:1px solid var(--glass-border); color:white; padding:6px 14px; border-radius:8px; cursor:pointer; font-size:12px;">🔄 รีเฟรช</button>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>เลขที่รายการ</th>
              <th>ชื่อลูกค้า</th>
              <th>จำนวนเงิน</th>
              <th>เวลาที่แจ้ง</th>
              <th>หลักฐานสลิป</th>
              <th>ดำเนินการ</th>
            </tr>
          </thead>
          <tbody id="pendingTable">
            <!-- ข้อมูลดึงมาจาก Google Sheet -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- ตารางประวัติที่ดำเนินการไปแล้ว -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--sea-foam); margin-bottom: 15px;">📜 ประวัติการอนุมัติ / ปฏิเสธ ล่าสุด</h2>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>เลขที่รายการ</th>
              <th>ชื่อลูกค้า</th>
              <th>จำนวนเงิน</th>
              <th>สถานะ</th>
              <th>หลักฐานสลิป</th>
            </tr>
          </thead>
          <tbody id="historyTable">
            <!-- ข้อมูลดึงมาจาก Google Sheet -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";

    function showLoader(txt = "กำลังโหลด...") {
      document.getElementById("loaderText").innerText = txt;
      document.getElementById("loader").classList.add("active");
    }
    function hideLoader() { document.getElementById("loader").classList.remove("active"); }

    function notify(msg, ok = true) {
      const c = document.getElementById("toastContainer");
      const t = document.createElement("div"); t.className = "toast";
      t.style.borderLeft = ok ? "4px solid #22c55e" : "4px solid #f43f5e";
      t.innerHTML = `${ok ? '✅' : '⚠️'} ${msg}`;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    // 🖼️ ฟังก์ชันตรวจจับคีย์ URL สลิปและสร้างปุ่มกดดูสลิป
    function getSlipLinkHTML(item) {
      let url = "";

      // ค้นหาคีย์ที่มี URL Google Drive หรือ http
      Object.keys(item).forEach(key => {
        const val = item[key];
        if (typeof val === 'string' && val.startsWith('http')) {
          url = val;
        }
      });

      if (url) {
        return `<a href="${url}" target="_blank" class="btn-slip">🖼️ ดูสลิป</a>`;
      }
      return `<span class="no-slip">ไม่มีสลิป</span>`;
    }

    function loadData() {
      showLoader("กำลังดึงข้อมูลล่าสุด...");
      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          const pendingTbody = document.getElementById("pendingTable");
          const historyTbody = document.getElementById("historyTable");
          pendingTbody.innerHTML = "";
          historyTbody.innerHTML = "";

          let pendingCount = 0;

          data.forEach(item => {
            const status = item.Status || item.Col_4 || "";
            const amt = parseFloat(item.Amount || item.Col_2) || 0;
            const timeStr = item.Timestamp ? new Date(item.Timestamp).toLocaleString('th-TH') : '-';
            const slipHTML = getSlipLinkHTML(item);

            if (status === "Pending Verification") {
              pendingCount++;
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td style="font-size:12px; color:var(--sea-foam);">${item.Invoice_ID || item.Col_0 || '-'}</td>
                <td style="font-weight:600;">${item.Customer_Name || item.Col_1 || '-'}</td>
                <td style="color:#86efac; font-weight:600;">${Math.abs(amt).toLocaleString()} ฿</td>
                <td style="font-size:12px; color:#cbd5e1;">${timeStr}</td>
                <td>${slipHTML}</td>
                <td>
                  <button class="btn-approve" onclick="handleAction(${item.rowIndex}, 'approve')">อนุมัติ</button>
                  <button class="btn-reject" onclick="handleAction(${item.rowIndex}, 'reject')">ปฏิเสธ</button>
                </td>
              `;
              pendingTbody.appendChild(tr);
            } else {
              let badge = `<span class="badge-approved">✅ อนุมัติแล้ว</span>`;
              if (status === "Rejected") badge = `<span class="badge-rejected">❌ ปฏิเสธ</span>`;
              else if (amt > 0) badge = `<span style="color:#38bdf8;">📌 ตั้งหนี้</span>`;

              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td style="font-size:12px; color:var(--sea-foam);">${item.Invoice_ID || item.Col_0 || '-'}</td>
                <td>${item.Customer_Name || item.Col_1 || '-'}</td>
                <td style="font-weight:600;">${amt.toLocaleString()} ฿</td>
                <td>${badge}</td>
                <td>${slipHTML}</td>
              `;
              historyTbody.appendChild(tr);
            }
          });

          if (pendingCount === 0) {
            pendingTbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">ไม่มีรายการที่รอการอนุมัติ ✨</td></tr>`;
          }
        })
        .catch(err => notify("เกิดข้อผิดพลาดในการโหลดข้อมูล", false))
        .finally(() => hideLoader());
    }

    function handleAction(rowIndex, action) {
      const actionText = action === 'approve' ? 'อนุมัติ' : 'ปฏิเสธ';
      if (!confirm(`คุณต้องการ "${actionText}" รายการนี้ใช่หรือไม่?`)) return;

      showLoader(`กำลังดำเนินการ ${actionText}...`);

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ actionType: action, rowIndex: rowIndex })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          notify(`ทำรายการ ${actionText} เรียบร้อยแล้ว`);
          loadData();
        } else {
          notify("เกิดข้อผิดพลาด: " + (data.message || ""), false);
        }
      })
      .catch(err => notify("ไม่สามารถเชื่อมต่อระบบได้", false))
      .finally(() => hideLoader());
    }

    window.onload = loadData;
  </script>
</body>
</html>
