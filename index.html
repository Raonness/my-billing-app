<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Service - ตรวจสอบยอดและแจ้งชำระเงิน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #f43f5e;
      --accent-purple: #a855f7;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s ease; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }

    .container { width: 100%; max-width: 650px; }
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; background: linear-gradient(to right, #38bdf8, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; }
    .btn-success { background: linear-gradient(135deg, #16a34a, #059669); color: white; margin-top: 10px; }
    .btn-admin-link { background: rgba(255, 255, 255, 0.08); color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; border: 1px solid var(--glass-border); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th { text-align: left; padding: 10px 8px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
    td { padding: 10px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .status-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-approved { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-charge { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border: 1px solid rgba(244, 63, 94, 0.3); }

    .summary-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 15px;
      border-radius: 14px;
      text-align: right;
      font-size: 18px;
      font-weight: 600;
      color: #fda4af;
      margin-top: 15px;
    }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; padding: 14px 20px; border-radius: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--glass-border); color: white; font-size: 14px; }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="top-bar">
      <h1>🙋‍♂️ ระบบบริการลูกค้า</h1>
      <a href="payment.html" class="btn-admin-link">🔒 สำหรับผู้ดูแลระบบ</a>
    </div>

    <!-- ส่วนที่ 1: ตรวจสอบยอดค้าง -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--accent-cyan);">🔍 1. ตรวจสอบยอดค้างชำระ</h2>
      <div class="form-group">
        <label>กรอกชื่อของคุณเพื่อค้นหา:</label>
        <input type="text" id="searchName" placeholder="ระบุชื่อลูกค้าระบบ...">
      </div>
      <button class="btn btn-primary" id="searchBtn" onclick="checkBalance()">ค้นหายอดค้าง</button>

      <div id="resultArea" style="display:none;">
        <h3 style="font-size: 14px; color: var(--accent-purple); margin-top: 20px;">ประวัติรายการของคุณ</h3>
        <table>
          <thead>
            <tr>
              <th>รายการ</th>
              <th>สถานะ</th>
              <th>จำนวนเงิน</th>
            </tr>
          </thead>
          <tbody id="resultTableBody"></tbody>
        </table>
        <div class="summary-box" id="totalPendingBox">ยอดค้างชำระคงเหลือ: 0.00 บาท</div>
      </div>
    </div>

    <!-- ส่วนที่ 2: ฟอร์มแจ้งชำระเงินสำหรับลูกค้า -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--accent-green);">💳 2. แจ้งชำระเงิน (Submit Payment)</h2>
      <form id="clientPaymentForm">
        <div class="form-group">
          <label>ชื่อลูกค้า (ให้ตรงกับระบบ):</label>
          <input type="text" id="payCustomerName" placeholder="ระบุชื่อของคุณ" required>
        </div>
        <div class="form-group">
          <label>จำนวนเงินที่โอนชำระ (บาท):</label>
          <input type="number" id="payAmount" placeholder="0.00" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-success" id="payBtn">ยืนยันการแจ้งชำระเงิน</button>
      </form>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";

    function notify(message, isSuccess = true) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.style.borderLeft = isSuccess ? "4px solid #22c55e" : "4px solid #f43f5e";
      toast.innerHTML = `<span>${isSuccess ? '✅' : '⚠️'}</span> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function checkBalance() {
      const searchName = document.getElementById("searchName").value.trim().toLowerCase();
      const btn = document.getElementById("searchBtn");
      
      if (!searchName) {
        notify("กรุณากรอกชื่อเพื่อค้นหา", false);
        return;
      }

      btn.innerText = "กำลังค้นหา...";
      btn.disabled = true;

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          const tableBody = document.getElementById("resultTableBody");
          tableBody.innerHTML = "";
          let totalPendingSum = 0;
          let matchCount = 0;

          data.forEach(item => {
            if (item.Customer_Name && item.Customer_Name.toString().toLowerCase().includes(searchName)) {
              matchCount++;
              const row = document.createElement("tr");
              const amt = parseFloat(item.Amount) || 0;
              const status = item.Status || "";

              let statusHTML = "";
              let isPendingVerification = (status === "Pending Verification");

              // ⚡ รวมยอดเฉพาะรายการที่เป็น "ยอดตั้งหนี้" หรือ "ยอดชำระที่ Admin อนุมัติแล้ว" เท่านั้น
              if (!isPendingVerification) {
                totalPendingSum += amt;
              }

              // จัดการการแสดงผลป้ายสถานะ
              if (isPendingVerification) {
                statusHTML = `<span class="status-badge badge-pending">⏳ รอ Admin ตรวจสอบ</span>`;
              } else if (amt < 0) {
                statusHTML = `<span class="status-badge badge-approved">✅ ชำระแล้ว</span>`;
              } else {
                statusHTML = `<span class="status-badge badge-charge">📌 ตั้งหนี้</span>`;
              }

              const displayAmt = Math.abs(amt).toLocaleString() + " ฿";

              row.innerHTML = `
                <td style="font-size:12px; color:var(--accent-cyan);">${item.Invoice_ID || '-'}</td>
                <td>${statusHTML}</td>
                <td style="color:${amt < 0 ? (isPendingVerification ? 'var(--accent-amber)' : 'var(--accent-green)') : 'var(--accent-red)'}; font-weight:600;">
                  ${amt < 0 ? '-' : '+'}${displayAmt}
                </td>
              `;
              tableBody.appendChild(row);
            }
          });

          if (matchCount === 0) {
            notify("ไม่พบประวัติชื่อนี้ในระบบ", false);
            document.getElementById("resultArea").style.display = "none";
          } else {
            const finalBox = document.getElementById("totalPendingBox");
            finalBox.innerText = "ยอดค้างชำระคงเหลือ: " + totalPendingSum.toLocaleString() + " บาท";
            
            if (totalPendingSum <= 0) {
              finalBox.style.color = "#86efac";
              finalBox.style.borderColor = "rgba(34, 197, 94, 0.4)";
            } else {
              finalBox.style.color = "#fda4af";
              finalBox.style.borderColor = "rgba(244, 63, 94, 0.4)";
            }

            document.getElementById("resultArea").style.display = "block";
            document.getElementById("payCustomerName").value = document.getElementById("searchName").value;
          }
        })
        .catch(err => notify("เกิดข้อผิดพลาด: " + err, false))
        .finally(() => {
          btn.innerText = "ค้นหายอดค้าง";
          btn.disabled = false;
        });
    }

    document.getElementById("clientPaymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("payBtn");
      btn.innerText = "กำลังส่งข้อมูล...";
      btn.disabled = true;

      const payload = {
        actionType: "update",
        customerName: document.getElementById("payCustomerName").value.trim(),
        amount: parseFloat(document.getElementById("payAmount").value) || 0
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        notify("แจ้งชำระเงินเรียบร้อยแล้ว! (รอยืนยันจาก Admin)", true);
        document.getElementById("clientPaymentForm").reset();
        if (document.getElementById("searchName").value.trim()) {
          checkBalance();
        }
      })
      .catch(err => notify("เกิดข้อผิดพลาด: " + err, false))
      .finally(() => {
        btn.innerText = "ยืนยันการแจ้งชำระเงิน";
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
