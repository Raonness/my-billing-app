<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing System - ค้นหายอดค้างชำระ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #f43f5e;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s ease; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }

    .container { width: 100%; max-width: 700px; }
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeInUp 0.6s ease-out;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; background: linear-gradient(to right, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-nav { background: rgba(255, 255, 255, 0.1); color: var(--text-main); text-decoration: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; border: 1px solid var(--glass-border); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

    .summary-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 15px;
      border-radius: 14px;
      text-align: right;
      font-size: 18px;
      font-weight: 600;
      color: #fda4af;
      margin-top: 15px;
    }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { min-width: 250px; padding: 14px 20px; border-radius: 12px; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--glass-border); color: white; font-size: 14px; backdrop-filter: blur(10px); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    <div class="top-bar">
      <h1>⚡ Billing Dashboard</h1>
      <a href="payment.html" class="btn-nav">💳 หน้าชำระเงิน (Admin)</a>
    </div>

    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--accent-cyan);">🔍 ค้นหาประวัติและสรุปยอดค้างชำระ</h2>
      <div class="form-group">
        <label>กรอกชื่อลูกค้าเพื่อค้นหา:</label>
        <input type="text" id="searchName" placeholder="เช่น นายสมชาย หรือ บริษัท ABC...">
      </div>
      <button class="btn btn-primary" id="searchBtn" onclick="checkBalance()">ค้นหาข้อมูล</button>

      <div id="resultArea" style="display:none;">
        <h3 style="font-size: 15px; color: var(--accent-purple); margin-top: 20px;">ประวัติธุรกรรมทั้งหมด</h3>
        <table>
          <thead>
            <tr>
              <th>รายการ</th>
              <th>ประเภท</th>
              <th>จำนวนเงิน</th>
            </tr>
          </thead>
          <tbody id="resultTableBody"></tbody>
        </table>
        <div class="summary-box" id="totalPendingBox">สรุปยอดค้างชำระสุทธิ: 0.00 บาท</div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";

    function notify(message, type = 'info') {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>ℹ️</span> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function checkBalance() {
      const searchName = document.getElementById("searchName").value.trim().toLowerCase();
      const btn = document.getElementById("searchBtn");
      
      if (!searchName) {
        notify("กรุณากรอกชื่อลูกค้าเพื่อค้นหา");
        return;
      }

      btn.innerText = "กำลังคำนวณยอด...";
      btn.disabled = true;

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          const tableBody = document.getElementById("resultTableBody");
          tableBody.innerHTML = "";
          let totalPendingSum = 0;
          let matchCount = 0;

          data.forEach(item => {
            if (item.Customer_Name && item.Customer_Name.toString().toLowerCase().includes(searchName)) {
              matchCount++;
              const row = document.createElement("tr");
              const amt = parseFloat(item.Amount) || 0;

              totalPendingSum += amt;
              const isPayment = amt < 0;
              const displayAmt = Math.abs(amt).toLocaleString() + " ฿";

              row.innerHTML = `
                <td style="font-size:12px; color:var(--accent-cyan);">${item.Invoice_ID || '-'}</td>
                <td style="color:${isPayment ? 'var(--accent-green)' : 'var(--accent-orange)'}; font-weight:500;">
                  ${item.Status || (isPayment ? 'Payment' : 'Charge')}
                </td>
                <td style="color:${isPayment ? 'var(--accent-green)' : 'var(--accent-red)'}; font-weight:600;">
                  ${isPayment ? '-' : '+'}${displayAmt}
                </td>
              `;
              tableBody.appendChild(row);
            }
          });

          if (matchCount === 0) {
            notify("ไม่พบประวัติลูกค้ารายนี้ในระบบ");
            document.getElementById("resultArea").style.display = "none";
          } else {
            const finalBox = document.getElementById("totalPendingBox");
            finalBox.innerText = "สรุปยอดค้างชำระสุทธิ: " + totalPendingSum.toLocaleString() + " บาท";
            
            if (totalPendingSum <= 0) {
              finalBox.style.color = "#86efac";
              finalBox.style.borderColor = "rgba(34, 197, 94, 0.4)";
            } else {
              finalBox.style.color = "#fda4af";
              finalBox.style.borderColor = "rgba(244, 63, 94, 0.4)";
            }

            document.getElementById("resultArea").style.display = "block";
          }
        })
        .catch(err => notify("เกิดข้อผิดพลาด: " + err))
        .finally(() => {
          btn.innerText = "ค้นหาข้อมูล";
          btn.disabled = false;
        });
    }
  </script>
</body>
</html>
