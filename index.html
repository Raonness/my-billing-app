<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบเรียกเก็บเงิน</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>สร้างรายการเรียกเก็บเงิน</h2>
  <form id="billingForm">
    <div class="form-group">
      <label>ชื่อลูกค้า:</label>
      <input type="text" id="customerName" required>
    </div>
    <div class="form-group">
      <label>จำนวนเงิน:</label>
      <input type="number" id="amount" required>
    </div>
    <div class="form-group">
      <label>ยอดรวมสุทธิ (Total Amount):</label>
      <input type="number" id="totalAmount" required>
    </div>
    <button type="submit">บันทึกรายการ</button>
  </form>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxXiR_m3LjnvWR4b70xa8oxM4I_WMEsqQpigXI1oMQ7d31_9QIsc4HJ6zueakp0phVa/exec";

    document.getElementById("billingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const payload = {
        customerName: document.getElementById("customerName").value,
        amount: document.getElementById("amount").value,
        totalAmount: document.getElementById("totalAmount").value, // ส่งค่ายอดรวม
        status: "Pending"
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("บันทึกข้อมูลสำเร็จ!");
        document.getElementById("billingForm").reset();
      })
      .catch(err => alert("เกิดข้อผิดพลาด: " + err));
    });
  </script>
</body>
</html>
