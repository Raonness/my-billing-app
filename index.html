<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบชำระเงิน - Huahin Ocean</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --sea-deep: #0a2540; --sea-cyan: #00b4d8; --sea-foam: #90e0ef;
      --glass-sea: rgba(10, 37, 64, 0.75); --glass-border: rgba(144, 224, 239, 0.3);
    }
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.3s ease; }
    
    body {
      margin: 0; min-height: 100vh; color: white;
      background: linear-gradient(-45deg, #0a2540, #0077b6, #00b4d8, #03045e);
      background-size: 400% 400%; animation: gradientBG 15s ease infinite;
      overflow-x: hidden;
    }
    @keyframes gradientBG { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { 0% {transform: translateY(0px);} 50% {transform: translateY(-15px);} 100% {transform: translateY(0px);} }

    .loader-overlay { position: fixed; inset: 0; background: rgba(10,37,64,0.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; opacity: 0; pointer-events: none; }
    .loader-overlay.active { opacity: 1; pointer-events: auto; }
    .spinner { width: 60px; height: 60px; border: 5px solid var(--glass-border); border-top-color: var(--sea-cyan); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #welcomePage { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px; background: rgba(10, 37, 64, 0.5); backdrop-filter: blur(8px); }
    .hero-title { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 700; margin-bottom: 10px; text-shadow: 0 4px 20px rgba(0,180,216,0.8); background: linear-gradient(to right, #fff, var(--sea-foam)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: float 4s ease-in-out infinite; }
    .btn-start { padding: 15px 40px; font-size: 1.2rem; font-weight: 600; color: #0a2540; background: linear-gradient(135deg, var(--sea-foam), var(--sea-cyan)); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 25px rgba(0, 180, 216, 0.6); margin-top: 30px; animation: fadeInUp 1s ease forwards 0.5s; opacity: 0; }
    .btn-start:hover { transform: scale(1.05) translateY(-5px); box-shadow: 0 10px 30px rgba(0, 180, 216, 0.8); }

    #mainContent { display: none; opacity: 0; padding: 40px 15px; }
    .container { max-width: 800px; margin: 0 auto; animation: fadeInUp 0.8s ease forwards; }
    .card { background: var(--glass-sea); backdrop-filter: blur(25px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; margin-bottom: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    input { width: 100%; padding: 14px 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 16px; outline: none; }
    input:focus { border-color: var(--sea-cyan); background: rgba(255, 255, 255, 0.1); }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 15px; }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; margin-top: 10px; }
    .btn-qr { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; margin-top: 15px; }
    .btn-success { background: linear-gradient(135deg, #16a34a, #15803d); color: white; margin-bottom: 15px;}

    .table-responsive { overflow-x: auto; margin-top: 20px; border-radius: 12px; border: 1px solid var(--glass-border); }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th { padding: 15px; background: rgba(255,255,255,0.05); color: var(--sea-foam); text-align: left; }
    td { padding: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
    .modal-content { background: var(--sea-deep); border: 1px solid var(--glass-border); padding: 30px; border-radius: 24px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); animation: fadeInUp 0.4s ease forwards; }
    .qr-box { background: white; padding: 20px; border-radius: 20px; display: inline-block; margin: 20px 0; box-shadow: 0 10px 25px rgba(255,255,255,0.2); }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999999; }
    .toast { padding: 15px 25px; border-radius: 12px; background: rgba(10, 37, 64, 0.95); border: 1px solid var(--glass-border); color: white; font-size: 15px; margin-bottom: 10px; animation: fadeInUp 0.3s ease forwards; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    @media (max-width: 600px) {
      .card { padding: 20px; }
      .top-bar h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="loader-overlay" id="globalLoader">
    <div class="spinner"></div>
    <div style="color:var(--sea-foam); margin-top:15px; font-size:16px;">กำลังโหลด...</div>
  </div>
  <div class="toast-container" id="toastContainer"></div>

  <div id="welcomePage">
    <h1 class="hero-title">หัวหินทริป 🌊</h1>
    <p style="color:var(--sea-foam); font-size:1.2rem; margin-bottom: 10px; opacity: 0; animation: fadeInUp 1s ease forwards 0.3s;">ยินดีต้อนรับสู่ระบบชำระเงิน</p>
    <button class="btn-start" onclick="startExperience()">เริ่มใช้งานระบบ</button>
  </div>

  <div id="mainContent">
    <div class="container">
      <div class="top-bar">
        <h1>🏖️ ตรวจสอบยอดและแจ้งชำระ</h1>
        <a href="payment.html" style="color:var(--sea-foam); text-decoration:none; padding:8px 16px; border:1px solid var(--glass-border); border-radius:50px; font-size:14px;">🔒 ระบบแอดมิน</a>
      </div>

      <div class="card">
        <label style="color:var(--sea-cyan); font-weight:600; font-size:1.1rem; display:block; margin-bottom:10px;">🔍 ตรวจสอบยอดค้างชำระ</label>
        <input type="text" id="searchName" placeholder="พิมพ์ชื่อของคุณ...">
        <button class="btn btn-primary" onclick="checkBalance()">ตรวจสอบข้อมูล</button>

        <div id="resultArea" style="display:none; margin-top: 30px; animation: fadeInUp 0.5s ease forwards;">
          <div class="table-responsive">
            <table>
              <thead><tr><th>รายการ</th><th>สถานะ</th><th>จำนวนเงิน</th></tr></thead>
              <tbody id="resultTableBody"></tbody>
            </table>
          </div>
          <div style="background: rgba(244, 162, 97, 0.15); border: 1px solid rgba(244,162,97,0.4); padding: 20px; border-radius: 16px; text-align: center; font-size: 1.2rem; font-weight: 700; color: #f4a261; margin-top: 20px;">
            <span id="totalPendingBox">ยอดค้างชำระ: 0.00 บาท</span>
          </div>
          <button class="btn btn-qr" onclick="openQrModalFromTotal()">📱 สแกนจ่ายยอดทั้งหมด</button>
        </div>
      </div>

      <div class="card">
        <label style="color:#86efac; font-weight:600; font-size:1.1rem; display:block; margin-bottom:10px;">💳 โอนเงินและแจ้งชำระ (ระบุยอดเอง)</label>
        <div style="display:grid; gap:15px;">
          <input type="text" id="payCustomerName" placeholder="ชื่อลูกค้า">
          <input type="number" id="payAmount" placeholder="จำนวนเงิน (บาท)">
        </div>
        <button class="btn btn-qr" onclick="openQrModalFromInput()">📱 ตรวจสอบชื่อและสร้าง QR Code</button>
      </div>
    </div>
  </div>

  <div class="modal" id="qrModal">
    <div class="modal-content">
      <h2 style="margin-top:0; color:var(--sea-cyan);">📱 สแกนจ่าย PromptPay</h2>
      <p style="color:#cbd5e1; font-size:1.1rem;">คุณ: <b id="modalCustomerName" style="color:white;">-</b></p>
      
      <div class="qr-box"><div id="qrCodeContainer"></div></div>

      <div style="font-size: 1.8rem; font-weight: 700; color: #86efac; margin-bottom: 20px;">
        <span id="modalAmountDisplay">0.00</span> ฿
      </div>

      <div style="text-align: left; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--glass-border);">
        <label style="color:var(--sea-foam); font-size:14px; margin-bottom:10px; display:block;">📸 แนบหลักฐานการโอน (สลิป):</label>
        <input type="file" id="modalSlipFile" accept="image/*" style="border:none; padding:0; background:transparent;">
      </div>

      <button class="btn btn-success" onclick="submitModalPayment()">✅ ยืนยันการชำระเงิน</button>
      <button class="btn" style="background:rgba(255,255,255,0.1); color:white;" onclick="closeQrModal()">ยกเลิก</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";
    const PROMPTPAY_NUMBER = "004666016949996"; 
    let currentTotalPending = 0;

    function showLoader() { document.getElementById("globalLoader").classList.add("active"); }
    function hideLoader() { document.getElementById("globalLoader").classList.remove("active"); }

    function startExperience() {
      document.getElementById("welcomePage").style.display = "none";
      const main = document.getElementById("mainContent");
      main.style.display = "block";
      setTimeout(() => { main.style.opacity = "1"; }, 50);
    }

    function notify(msg, ok=true) {
      const c = document.getElementById("toastContainer");
      const t = document.createElement("div"); t.className = "toast";
      t.style.borderLeft = ok ? "5px solid #22c55e" : "5px solid #ef4444";
      t.innerHTML = msg; c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    // ฟังก์ชันดึงค่าฟิลด์แบบปลอดภัย รองรับทุกหัวตารางของหลังบ้านเดิม
    function getItemVal(item, keys) {
      for (let k of keys) {
        if (item[k] !== undefined && item[k] !== null && item[k] !== "") return item[k];
      }
      return "";
    }
    function extractName(item) { return getItemVal(item, ["Customer_Name", "Customer Name", "Col_1"]).toString().trim(); }
    function extractAmount(item) { let a = parseFloat(getItemVal(item, ["Amount", "Col_2"])); return isNaN(a) ? 0 : a; }
    function extractStatus(item) { return getItemVal(item, ["Status", "Col_4"]).toString().trim(); }

    function generatePromptPayPayload(target, amount) {
      function sanitizeInput(input) { return input.replace(/[^0-9]/g, ''); }
      function formatField(id, value) { return id + ('0' + value.length).slice(-2) + value; }
      function crc16(data) { let crc = 0xFFFF; for (let i=0; i<data.length; i++) { crc ^= data.charCodeAt(i) << 8; for (let j=0; j<8; j++) { crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : crc << 1; } } return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0'); }
      const cleanTarget = sanitizeInput(target);
      let targetType = cleanTarget.length === 10 ? '01' : (cleanTarget.length === 13 ? '02' : '03');
      let targetFormatted = targetType === '01' ? '0066' + cleanTarget.substring(1) : cleanTarget;
      const merchantInfo = formatField('00', 'A000000677010111') + formatField(targetType, targetFormatted);
      let payload = formatField('00', '01') + formatField('01', (amount && amount>0) ? '12' : '11') + formatField('29', merchantInfo) + formatField('53', '764') + formatField('58', 'TH');
      if (amount && amount > 0) payload += formatField('54', parseFloat(amount).toFixed(2));
      payload += '6304'; return payload + crc16(payload);
    }

    function checkBalance() {
      const searchKey = document.getElementById("searchName").value.trim().toLowerCase();
      if(!searchKey) return notify("⚠️ กรุณากรอกชื่อก่อนทำการค้นหา", false);
      showLoader();
      fetch(WEB_APP_URL).then(r=>r.json()).then(data => {
        const tbody = document.getElementById("resultTableBody"); tbody.innerHTML = "";
        let total = 0, count = 0;
        data.forEach(item => {
          const cName = extractName(item);
          if (cName && cName.toLowerCase().includes(searchKey)) {
            count++; 
            const amt = extractAmount(item); 
            const stat = extractStatus(item);
            if(stat !== "Pending Verification" && stat !== "Rejected") total += amt;
            let b = `<span style="color:#f59e0b;">⏳ รออนุมัติ</span>`;
            if(stat==="Rejected") b = `<span style="color:#ef4444;">❌ ปฏิเสธ</span>`;
            else if(amt<0) b = `<span style="color:#22c55e;">✅ ชำระแล้ว</span>`;
            else if(stat !== "Pending Verification") b = `<span style="color:#0ea5e9;">📌 ตั้งหนี้</span>`;
            
            const invId = getItemVal(item, ["Invoice_ID", "Invoice ID", "Col_0"]) || '-';
            tbody.innerHTML += `<tr><td style="font-size:13px; color:#cbd5e1;">${invId}</td><td>${b}</td><td style="font-weight:bold;">${Math.abs(amt).toLocaleString()} ฿</td></tr>`;
          }
        });
        if(count===0){ 
          notify("❌ ไม่พบข้อมูลรายชื่อนี้ในระบบ", false); 
          document.getElementById("resultArea").style.display="none"; 
        } else {
          currentTotalPending = total;
          document.getElementById("totalPendingBox").innerText = `ยอดค้างชำระ: ${total.toLocaleString()} บาท`;
          document.getElementById("resultArea").style.display = "block";
          document.getElementById("payCustomerName").value = document.getElementById("searchName").value;
        }
      }).catch(()=>notify("❌ เชื่อมต่อฐานข้อมูลล้มเหลว", false)).finally(()=>hideLoader());
    }

    function showQrModal(cName, amt) {
      if(!cName || amt<=0) return notify("⚠️ กรุณาระบุชื่อและจำนวนเงินที่ถูกต้อง", false);
      document.getElementById("modalCustomerName").innerText = cName;
      document.getElementById("modalAmountDisplay").innerText = parseFloat(amt).toLocaleString();
      const cont = document.getElementById("qrCodeContainer"); cont.innerHTML = "";
      new QRCode(cont, { text: generatePromptPayPayload(PROMPTPAY_NUMBER, amt), width: 220, height: 220, colorDark:"#000", colorLight:"#fff" });
      document.getElementById("qrModal").style.display = "flex";
    }

    function openQrModalFromTotal() { 
      showQrModal(document.getElementById("searchName").value, currentTotalPending); 
    }

    function openQrModalFromInput() { 
      const name = document.getElementById("payCustomerName").value.trim();
      const amt = parseFloat(document.getElementById("payAmount").value)||0;
      if(!name) return notify("⚠️ กรุณากรอกชื่อลูกค้าก่อน", false);
      if(amt<=0) return notify("⚠️ กรุณากรอกจำนวนเงินให้ถูกต้อง", false);

      showLoader();
      fetch(WEB_APP_URL).then(r=>r.json()).then(data => {
        const found = data.some(item => extractName(item).toLowerCase().includes(name.toLowerCase()));
        if(found) {
          showQrModal(name, amt);
        } else {
          notify("❌ ไม่พบรายชื่อลูกค้านี้ในระบบ กรุณาตรวจสอบชื่ออีกครั้ง", false);
        }
      }).catch(()=>notify("❌ ตรวจสอบรายชื่อล้มเหลว", false)).finally(()=>hideLoader());
    }

    function closeQrModal() { document.getElementById("qrModal").style.display = "none"; document.getElementById("modalSlipFile").value=""; }

    async function submitModalPayment() {
      const cName = document.getElementById("modalCustomerName").innerText;
      const amt = parseFloat(document.getElementById("modalAmountDisplay").innerText.replace(/,/g, ''))||0;
      const file = document.getElementById("modalSlipFile").files[0];
      showLoader();
      let b64 = "", mime = "";
      if(file) {
        b64 = await new Promise(r => { const rd = new FileReader(); rd.onloadend = ()=>r(rd.result); rd.readAsDataURL(file); });
        mime = file.type;
      }
      fetch(WEB_APP_URL, { method:"POST", body:JSON.stringify({ actionType:"update", customerName:cName, amount:amt, slipBase64:b64, mimeType:mime }) })
      .then(r=>r.json()).then(d=>{
        if(d.status==="success"){ notify("✅ ส่งข้อมูลการชำระเงินสำเร็จ"); closeQrModal(); if(document.getElementById("searchName").value) checkBalance(); }
        else notify("❌ " + (d.message||"เกิดข้อผิดพลาด"), false);
      }).catch(()=>notify("❌ ส่งข้อมูลไม่สำเร็จ", false)).finally(()=>hideLoader());
    }
  </script>
</body>
</html>
