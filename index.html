<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เริ่มต้นเที่ยวหัวหินกับพวกเรา - Huahin Ocean Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sea-deep: #0a2540;
      --sea-blue: #0077b6;
      --sea-cyan: #00b4d8;
      --sea-foam: #90e0ef;
      --sand-gold: #f4a261;
      --coral-red: #e76f51;
      --glass-sea: rgba(10, 37, 64, 0.6);
      --glass-border: rgba(144, 224, 239, 0.25);
      --text-light: #f8fafc;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.3s ease; }
    body { background: var(--sea-deep); color: var(--text-light); min-height: 100vh; margin: 0; overflow-x: hidden; }

    #welcomePage {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: linear-gradient(rgba(10, 37, 64, 0.4), rgba(10, 37, 64, 0.75)), 
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; text-align: center; padding: 20px;
    }

    .hero-title {
      font-size: 3.2rem; font-weight: 700; margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(0, 180, 216, 0.8);
      background: linear-gradient(to right, #ffffff, var(--sea-foam));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .hero-subtitle { font-size: 1.25rem; color: var(--sea-foam); margin-bottom: 35px; letter-spacing: 1px; }

    .btn-start {
      padding: 16px 48px; font-size: 1.2rem; font-weight: 600;
      color: #0a2540; background: linear-gradient(135deg, var(--sea-foam), var(--sea-cyan));
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.6), 0 0 50px rgba(0, 180, 216, 0.2);
      animation: pulse 2s infinite;
    }
    .btn-start:hover { transform: scale(1.08); box-shadow: 0 0 35px rgba(144, 224, 239, 0.9); }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .ocean-curtain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, var(--sea-cyan), var(--sea-deep));
      z-index: 10000; pointer-events: none; opacity: 0; transform: translateY(100%);
      transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .ocean-curtain.active { transform: translateY(0%); opacity: 1; }

    #mainContent {
      display: none; opacity: 0; transition: opacity 0.8s ease;
      min-height: 100vh; padding: 30px 15px;
      background: linear-gradient(180deg, rgba(10,37,64,0.85) 0%, rgba(0,119,182,0.65) 100%),
                  url('https://images.unsplash.com/photo-1512100356356-de1b84283e18?auto=format&fit=crop&w=1920&q=80') center/cover fixed no-repeat;
    }

    .container { max-width: 720px; margin: 0 auto; }
    .card {
      background: var(--glass-sea); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 28px; margin-bottom: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; color: var(--sea-foam); text-shadow: 0 2px 8px rgba(0,180,216,0.4); }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--sea-foam); }
    input {
      width: 100%; padding: 12px 16px; background: rgba(10, 37, 64, 0.75);
      border: 1px solid var(--glass-border); border-radius: 12px; color: white; font-size: 15px; outline: none;
    }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: linear-gradient(135deg, var(--sea-cyan), var(--sea-blue)); color: white; }
    .btn-success { background: linear-gradient(135deg, #22c55e, #059669); color: white; margin-top: 10px; }
    .btn-admin-link { background: rgba(255,255,255,0.1); color: var(--sea-foam); text-decoration: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; border: 1px solid var(--glass-border); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th { text-align: left; padding: 10px 8px; color: var(--sea-foam); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }

    .summary-box {
      background: rgba(244, 162, 97, 0.15); border: 1px solid rgba(244, 162, 97, 0.4);
      padding: 16px; border-radius: 14px; text-align: right; font-size: 18px; font-weight: 600; color: var(--sand-gold); margin-top: 15px;
    }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; }
    .toast { padding: 14px 20px; border-radius: 12px; background: rgba(10, 37, 64, 0.95); border: 1px solid var(--glass-border); color: white; font-size: 14px; }
  </style>
</head>
<body>

  <div class="ocean-curtain" id="oceanCurtain"></div>
  <div class="toast-container" id="toastContainer"></div>

  <!-- 1. Landing Page -->
  <div id="welcomePage">
    <h1 class="hero-title">หัวหินกับพวกเรา 🌊</h1>
    <p class="hero-subtitle">สัมผัสประสบการณ์สุดพิเศษ และจัดการข้อมูลบริการได้อย่างง่ายดาย</p>
    <button class="btn-start" onclick="startExperience()">เริ่มกันเลย</button>
  </div>

  <!-- 2. หน้าหลัก -->
  <div id="mainContent">
    <div class="container">
      <div class="top-bar">
        <h1>🏖️ สรุปยอดบริการหัวหิน</h1>
        <a href="payment.html" class="btn-admin-link">🔒 สำหรับผู้ดูแลระบบ</a>
      </div>

      <div class="card">
        <h2 style="margin-top:0; font-size: 18px; color: var(--sea-cyan);">🔍 ตรวจสอบยอดและประวัติทำรายการ</h2>
        <div class="form-group">
          <label>ระบุชื่อของคุณเพื่อค้นหา:</label>
          <input type="text" id="searchName" placeholder="พิมพ์ชื่อลูกค้าระบบ...">
        </div>
        <button class="btn btn-primary" id="searchBtn" onclick="checkBalance()">ค้นหาข้อมูล</button>

        <div id="resultArea" style="display:none;">
          <h3 style="font-size: 14px; color: var(--sea-foam); margin-top: 20px;">ประวัติรายการทั้งหมด (ล่าสุดอยู่บน)</h3>
          <table>
            <thead>
              <tr>
                <th>รายการ</th>
                <th>เวลาทำรายการ</th>
                <th>สถานะ</th>
                <th>จำนวนเงิน</th>
              </tr>
            </thead>
            <tbody id="resultTableBody"></tbody>
          </table>
          <div class="summary-box" id="totalPendingBox">ยอดค้างชำระคงเหลือ: 0.00 บาท</div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-top:0; font-size: 18px; color: #86efac;">💳 แจ้งชำระเงินออนไลน์</h2>
        <form id="clientPaymentForm">
          <div class="form-group">
            <label>ชื่อลูกค้า (ให้ตรงกับระบบ):</label>
            <input type="text" id="payCustomerName" placeholder="ระบุชื่อของคุณ" required>
          </div>
          <div class="form-group">
            <label>จำนวนเงินที่โอนชำระ (บาท):</label>
            <input type="number" id="payAmount" placeholder="0.00" step="0.01" required>
          </div>
          <button type="submit" class="btn btn-success" id="payBtn">ส่งข้อมูลชำระเงิน</button>
        </form>
      </div>

    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";

    function startExperience() {
      const curtain = document.getElementById("oceanCurtain");
      curtain.classList.add("active");

      setTimeout(() => {
        document.getElementById("welcomePage").style.display = "none";
        const main = document.getElementById("mainContent");
        main.style.display = "block";
        setTimeout(() => { main.style.opacity = "1"; }, 50);
      }, 700);

      setTimeout(() => {
        curtain.classList.remove("active");
      }, 1200);
    }

    function notify(msg, ok = true) {
      const c = document.getElementById("toastContainer");
      const t = document.createElement("div");
      t.className = "toast";
      t.style.borderLeft = ok ? "4px solid #22c55e" : "4px solid #f43f5e";
      t.innerHTML = `${ok ? '✅' : '⚠️'} ${msg}`;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    function checkBalance() {
      const name = document.getElementById("searchName").value.trim().toLowerCase();
      const btn = document.getElementById("searchBtn");
      if (!name) return notify("กรุณากรอกชื่อเพื่อค้นหา", false);

      btn.innerText = "กำลังค้นหา..."; btn.disabled = true;

      fetch(WEB_APP_URL)
        .then(r => r.json())
        .then(data => {
          const tbody = document.getElementById("resultTableBody");
          tbody.innerHTML = "";
          let total = 0, count = 0;

          data.forEach(item => {
            if (item.Customer_Name && item.Customer_Name.toString().toLowerCase().includes(name)) {
              count++;
              const amt = parseFloat(item.Amount) || 0;
              const status = item.Status || "";
              const isPending = (status === "Pending Verification");

              if (!isPending && status !== "Rejected") total += amt;

              const timeStr = item.Timestamp ? new Date(item.Timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '-';

              let badge = `<span style="color:#f59e0b;">⏳ รออนุมัติ</span>`;
              if (status === "Rejected") badge = `<span style="color:#f43f5e;">❌ ปฏิเสธ</span>`;
              else if (amt < 0) badge = `<span style="color:#22c55e;">✅ ชำระแล้ว</span>`;
              else if (!isPending) badge = `<span style="color:#38bdf8;">📌 ตั้งหนี้</span>`;

              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td style="font-size:12px; color:var(--sea-foam);">${item.Invoice_ID || '-'}</td>
                <td style="font-size:11px; color:#cbd5e1;">${timeStr}</td>
                <td>${badge}</td>
                <td style="font-weight:600; color:${amt < 0 ? '#86efac' : '#fca5a5'};">${amt < 0 ? '-' : '+'}${Math.abs(amt).toLocaleString()} ฿</td>
              `;
              // เพิ่มแถวรายการใหม่ไว้ที่ด้านบนสุด
              tbody.appendChild(tr);
            }
          });

          if (count === 0) {
            notify("ไม่พบประวัติชื่อนี้ในระบบ", false);
            document.getElementById("resultArea").style.display = "none";
          } else {
            document.getElementById("totalPendingBox").innerText = "ยอดค้างชำระคงเหลือ: " + total.toLocaleString() + " บาท";
            document.getElementById("resultArea").style.display = "block";
            document.getElementById("payCustomerName").value = document.getElementById("searchName").value;
          }
        })
        .finally(() => { btn.innerText = "ค้นหาข้อมูล"; btn.disabled = false; });
    }

    document.getElementById("clientPaymentForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("payBtn");
      btn.innerText = "กำลังส่ง..."; btn.disabled = true;

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          actionType: "update",
          customerName: document.getElementById("payCustomerName").value.trim(),
          amount: parseFloat(document.getElementById("payAmount").value) || 0
        })
      })
      .then(() => {
        notify("แจ้งชำระเงินเรียบร้อยแล้ว! (รอ Admin ตรวจสอบ)");
        document.getElementById("clientPaymentForm").reset();
        if (document.getElementById("searchName").value.trim()) checkBalance();
      })
      .finally(() => { btn.innerText = "ส่งข้อมูลชำระเงิน"; btn.disabled = false; });
    });
  </script>
</body>
</html>
