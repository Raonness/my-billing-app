<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing System - Pro Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
      --accent-green: #22c55e;
      --accent-red: #f43f5e;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 20px 10px; margin: 0; display: flex; flex-direction: column; align-items: center; }

    /* Container & Cards */
    .container { width: 100%; max-width: 650px; }
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      animation: fadeInUp 0.6s ease-out;
    }

    /* Header Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h1 { font-size: 22px; margin: 0; background: linear-gradient(to right, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Form & Input Elements */
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6); }
    .btn-admin { background: rgba(255, 255, 255, 0.1); color: var(--accent-cyan); width: auto; padding: 8px 16px; border: 1px solid var(--glass-border); }
    .btn-admin:hover { background: rgba(56, 189, 248, 0.2); }
    .btn-pay { background: rgba(56, 189, 248, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 4px 10px; font-size: 12px; border-radius: 8px; cursor: pointer; }
    .btn-pay:hover { background: var(--accent-cyan); color: #0f172a; }
    .btn-status { padding: 4px 12px; font-size: 12px; border-radius: 20px; border: none; cursor: pointer; }
    .btn-status.pending { background: rgba(244, 63, 94, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .btn-status.paid { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

    /* Table Design */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th { text-align: left; padding: 12px 8px; color: var(--text-muted); border-bottom: 1px solid var(--glass-border); }
    td { padding: 12px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); vertical-align: middle; }

    /* Dashboard Summary Box */
    .summary-box {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 15px;
      border-radius: 14px;
      text-align: right;
      font-size: 18px;
      font-weight: 600;
      color: #fda4af;
      margin-top: 15px;
    }

    /* Modal Windows (Login & Pay Modal) */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; width: 90%; max-width: 420px; animation: zoomIn 0.3s ease; text-align: center; }

    /* QR Code Container Styling */
    .qr-box {
      background: #ffffff;
      padding: 15px;
      border-radius: 16px;
      display: inline-block;
      margin: 15px 0;
    }
    .qr-box img { width: 200px; height: 200px; display: block; }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      min-width: 250px;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--glass-border);
      color: white;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      animation: slideInRight 0.4s ease-out;
    }
    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.info { border-left: 4px solid var(--accent-cyan); }
    .toast.warning { border-left: 4px solid var(--accent-red); }

    /* Animations */
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

  <!-- กล่องแสดงตัวดำเนินการแจ้งเตือนสถานะ -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    
    <!-- Header & Admin Login Button -->
    <div class="top-bar">
      <h1>⚡ Billing Dashboard</h1>
      <button class="btn btn-admin" id="loginToggleBtn" onclick="toggleLoginModal()">🔒 เข้าสู่ระบบ Admin</button>
    </div>

    <!-- ส่วนที่ 1: ตรวจสอบยอดค้างชำระ (สำหรับทุกคน) -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 18px; color: var(--accent-cyan);">🔍 ตรวจสอบยอดค้างชำระ</h2>
      <div class="form-group">
        <label>กรอกชื่อลูกค้าของคุณเพื่อค้นหา:</label>
        <input type="text" id="searchName" placeholder="เช่น นายสมชาย หรือ บริษัท ABC...">
      </div>
      <button class="btn btn-primary" id="searchBtn" onclick="checkBalance()">ค้นหายอดค้างชำระ</button>

      <div id="resultArea" style="display:none;">
        <table>
          <thead>
            <tr>
              <th>รายการ</th>
              <th>ยอดสุทธิ</th>
              <th>สถานะ</th>
              <th>ชำระเงิน</th>
            </tr>
          </thead>
          <tbody id="resultTableBody"></tbody>
        </table>
        <div class="summary-box" id="totalPendingBox">รวมยอดค้างชำระ: 0.00 บาท</div>
      </div>
    </div>

    <!-- ส่วนที่ 2: ฟอร์มบันทึกข้อมูล (เฉพาะ Admin เท่านั้น) -->
    <div class="card" id="adminPanel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin:0; font-size: 18px; color: var(--accent-purple);">📝 บันทึกการเรียกเก็บเงิน (Admin Mode)</h2>
        <span style="font-size: 12px; color: var(--accent-green); background: rgba(34, 197, 94, 0.2); padding: 4px 8px; border-radius: 8px;">● Logged in</span>
      </div>
      
      <form id="billingForm">
        <div class="form-group">
          <label>ชื่อลูกค้า:</label>
          <input type="text" id="customerName" placeholder="ระบุชื่อลูกค้า" required>
        </div>
        <div class="form-group">
          <label>จำนวนเงิน (บาท):</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" required>
        </div>
        <div class="form-group">
          <label>ยอดรวมสุทธิ (Total Amount):</label>
          <input type="number" id="totalAmount" placeholder="0.00" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="background: linear-gradient(135deg, #a855f7, #6366f1);">บันทึกรายการลง Sheet</button>
      </form>
    </div>

  </div>

  <!-- Modal สำหรับ Log in Admin -->
  <div class="modal" id="loginModal">
    <div class="modal-content" style="text-align: left;">
      <h2 style="margin-top:0; text-align: center; color: var(--accent-cyan);">🔐 เข้าสู่ระบบ Admin</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>ชื่อผู้ใช้งาน (Username):</label>
          <input type="text" id="adminUser" placeholder="Username" required>
        </div>
        <div class="form-group">
          <label>รหัสผ่าน (Password):</label>
          <input type="password" id="adminPass" placeholder="Password" required>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
          <button type="button" class="btn" style="background: transparent; color: var(--text-muted);" onclick="toggleLoginModal()">ยกเลิก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal แสดง QR Code ชำระเงินผ่าน PromptPay -->
  <div class="modal" id="payModal">
    <div class="modal-content">
      <h3 style="margin-top:0; color: var(--accent-cyan); font-size: 20px;">📱 ชำระเงินด้วย PromptPay</h3>
      <p style="margin: 5px 0; color: var(--text-muted); font-size: 14px;">รายการของ: <b id="payCustomerName" style="color: white;">-</b></p>
      
      <div class="qr-box">
        <img id="modalQrImg" src="" alt="PromptPay QR Code">
      </div>

      <div style="font-size: 20px; font-weight: 600; color: var(--accent-green); margin-bottom: 15px;">
        ยอดชำระ: <span id="payAmountDisplay">0.00</span> บาท
      </div>

      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">
        เปิดแอปพลิเคชันธนาคารของคุณ แล้วสแกนคิวอาร์โค้ดนี้เพื่อชำระเงิน
      </p>

      <button class="btn" style="background: rgba(255, 255, 255, 0.1); color: white;" onclick="closePayModal()">ปิดหน้าต่าง</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8fSQb8lgA8HORmgP5QJAXhoiX7wo4xb5_aAcJesetbPCztV34GjdqOoeN4ZERqtHg/exec";
    const PROMPTPAY_NUMBER = "0812345678"; // ⚠️ เปลี่ยนเป็นเบอร์พร้อมเพย์ หรือ เลขผู้เสียภาษีของคุณ
    let isAdminLoggedIn = false;

    // ฟังก์ชันแสดงกล่องแจ้งเตือนตัวดำเนินการ (Toast Notification)
    function notify(message, type = 'info') {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      
      let icon = 'ℹ️';
      if (type === 'success') icon = '✅';
      if (type === 'warning') icon = '⚠️';

      toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ระบบ Log in Admin
    function toggleLoginModal() {
      if (isAdminLoggedIn) {
        isAdminLoggedIn = false;
        document.getElementById("adminPanel").style.display = "none";
        document.getElementById("loginToggleBtn").innerText = "🔒 เข้าสู่ระบบ Admin";
        notify("ออกจากระบบ Admin เรียบร้อยแล้ว", "warning");
      } else {
        const modal = document.getElementById("loginModal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
      }
    }

    function handleLogin(e) {
      if (e) e.preventDefault(); // ป้องกันการ Refresh หน้าเว็บ

      const u = document.getElementById("adminUser").value.trim();
      const p = document.getElementById("adminPass").value.trim();

      if (u === "Admin" && p === "Admin1123") {
        isAdminLoggedIn = true;
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("loginToggleBtn").innerText = "🔓 ออกจากระบบ Admin";
        
        document.getElementById("loginModal").style.display = "none";
        document.getElementById("adminUser").value = "";
        document.getElementById("adminPass").value = "";
        
        notify("เข้าสู่ระบบ Admin สำเร็จแล้ว!", "success");
      } else {
        notify("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!", "warning");
      }
    }

    // ฟังก์ชันบันทึกข้อมูล
    document.getElementById("billingForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "กำลังบันทึกข้อมูล...";
      btn.disabled = true;
      notify("กำลังส่งข้อมูลไปยัง Google Sheets...", "info");

      const payload = {
        customerName: document.getElementById("customerName").value,
        amount: document.getElementById("amount").value,
        totalAmount: document.getElementById("totalAmount").value,
        status: "Pending"
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        notify("ยืนยันการบันทึกข้อมูลเรียบร้อยแล้ว!", "success");
        document.getElementById("billingForm").reset();
      })
      .catch(err => notify("เกิดข้อผิดพลาด: " + err, "warning"))
      .finally(() => {
        btn.innerText = "บันทึกรายการลง Sheet";
        btn.disabled = false;
      });
    });

    // ค้นหา และ คำนวณสรุปยอดค้างชำระอัตโนมัติ
    function checkBalance() {
      const searchName = document.getElementById("searchName").value.trim().toLowerCase();
      const btn = document.getElementById("searchBtn");
      
      if (!searchName) {
        notify("กรุณากรอกชื่อลูกค้าเพื่อค้นหา", "warning");
        return;
      }

      btn.innerText = "กำลังค้นหาข้อมูล...";
      btn.disabled = true;
      notify("กำลังค้นหาข้อมูลยอดค้างชำระ...", "info");

      fetch(WEB_APP_URL)
        .then(res => res.json())
        .then(data => {
          const tableBody = document.getElementById("resultTableBody");
          tableBody.innerHTML = "";
          let totalPending = 0;
          let matchCount = 0;

          data.forEach(item => {
            if (item.Customer_Name && item.Customer_Name.toString().toLowerCase().includes(searchName)) {
              matchCount++;
              const row = document.createElement("tr");
              const amountVal = parseFloat(item.Total_Amount) || 0;
              const isPending = item.Status === "Pending";

              if (isPending) totalPending += amountVal;

              let statusBtnHTML = isPending 
                ? `<button class="btn-status pending" ${isAdminLoggedIn ? `onclick="toggleStatus('${item.Invoice_ID}', 'Paid')"` : ''}>ยังไม่ชำระ</button>`
                : `<button class="btn-status paid" ${isAdminLoggedIn ? `onclick="toggleStatus('${item.Invoice_ID}', 'Pending')"` : ''}>ชำระแล้ว</button>`;

              let payBtnHTML = isPending
                ? `<button class="btn-pay" onclick="openPayModal('${item.Customer_Name}', ${amountVal})">📲 จ่ายเงิน</button>`
                : `<span style="color:var(--text-muted); font-size:12px;">-</span>`;

              row.innerHTML = `
                <td>${item.Customer_Name}</td>
                <td>${amountVal.toLocaleString()} ฿</td>
                <td>${statusBtnHTML}</td>
                <td>${payBtnHTML}</td>
              `;
              tableBody.appendChild(row);
            }
          });

          if (matchCount === 0) {
            notify("ไม่พบข้อมูลลูกค้ารายนี้ในระบบ", "warning");
            document.getElementById("resultArea").style.display = "none";
          } else {
            notify(`ค้นพบข้อมูล ${matchCount} รายการ`, "success");
            document.getElementById("totalPendingBox").innerText = "ยอดค้างชำระรวมอัตโนมัติ: " + totalPending.toLocaleString() + " บาท";
            document.getElementById("resultArea").style.display = "block";
          }
        })
        .catch(err => notify("เกิดข้อผิดพลาด: " + err, "warning"))
        .finally(() => {
          btn.innerText = "ค้นหายอดค้างชำระ";
          btn.disabled = false;
        });
    }

    // ฟังก์ชันปรับสถานะการชำระเงิน
    function toggleStatus(invoiceId, newStatus) {
      if (!isAdminLoggedIn) return;
      if (!confirm("คุณต้องการเปลี่ยนสถานะรายการนี้ใช่หรือไม่?")) return;

      notify("กำลังอัปเดตสถานะการชำระเงิน...", "info");

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "updateStatus",
          invoiceId: invoiceId,
          newStatus: newStatus
        })
      })
      .then(() => {
        notify("ยืนยันอัปเดตสถานะเรียบร้อยแล้ว!", "success");
        checkBalance();
      })
      .catch(err => notify("อัปเดตไม่สำเร็จ: " + err, "warning"));
    }

    // ฟังก์ชันเปิด/ปิด Modal PromptPay QR Code
    function openPayModal(customerName, amount) {
      document.getElementById("payCustomerName").innerText = customerName;
      document.getElementById("payAmountDisplay").innerText = amount.toLocaleString(undefined, {minimumFractionDigits: 2});
      
      // ดึงคิวอาร์โค้ดจาก PromptPay API Generator
      const qrUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${amount}.png`;
      document.getElementById("modalQrImg").src = qrUrl;

      document.getElementById("payModal").style.display = "flex";
    }

    function closePayModal() {
      document.getElementById("payModal").style.display = "none";
    }
  </script>
</body>
</html>
